title: Build Bridge
description: A GUI utility to organize, build, and launch your Unreal Engine projects on Itch.io and Steam.

remote_theme: just-the-docs/just-the-docs

url: "https://collederas.github.io"
baseurl: "/build-bridge"

color_scheme: light

search_enabled: true
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/Collederas/build-bridge"
  "Itch.io":
    - "https://collederas.itch.io/build-bridge"

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: yellow

defaults:
  - scope:
      path: ""
    values:
      layout: default

sass:
  quiet_deps: true

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
